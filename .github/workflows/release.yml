name: Release

# Tag v1.2.3 -> FacePresence-1.2.3-win-x64.exe as a GitHub Release.
# Signing settings live in the "release" environment (Settings -> Environments -> release), which only tags v* may use:
#   variables: ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT, ARTIFACT_SIGNING_PROFILE, AZURE_TENANT_ID, AZURE_CLIENT_ID
#   secret:    AZURE_CLIENT_SECRET
# Without them the release is unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version from tag
        id: v
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" | Out-File -Append $env:GITHUB_OUTPUT'
      - name: Build and sign
        shell: pwsh
        run: build/windows/build.ps1 -Version ${{ steps.v.outputs.version }}
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/FacePresence-*.exe
            out/FacePresence-*.exe.sha256
            LICENSE
            THIRD-PARTY-NOTICES.txt
          generate_release_notes: true
