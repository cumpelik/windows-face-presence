name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build (unsigned)
        run: pwsh build/windows/build.ps1 -Version 0.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: FacePresence-dev-win-x64
          path: out/FacePresence-*.exe*
